[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lebensmittelwarnung-cli"
version = "0.1.0"
description = "Lebensmittel- und Produktwarnungen der Bundesländer im Terminal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "smlfg"}]
keywords = ["lebensmittelwarnung", "rückruf", "cli", "verbraucherschutz"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/smlfg/lebensmittelwarnung-cli"

[project.scripts]
lmw = "lebensmittelwarnung_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
